    font-size: 1.4rem;
    color: #fff;

  }

  #header p {

  }

  #legend {

    gap: 20px;
    align-items: center;
  }

    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.7);
  }

  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #canvas-wrap {
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }

  #canvas-wrap:active { cursor: grabbing; }

  svg {
    width: 100%;
    height: 100%;
  }

  .node-circle {
    transition: filter 0.2s, transform 0.2s;
    cursor: pointer;
  }

  .node-circle:hover {
    filter: brightness(1.3) drop-shadow(0 0 12px currentColor);
  }

  .edge-line {
    stroke-opacity: 0.35;
    stroke-linecap: round;
    transition: stroke-opacity 0.2s;
  }

  .node-label {
    pointer-events: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    fill: white;
    text-anchor: middle;
    dominant-baseline: central;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  #tooltip {
    position: fixed;
    background: rgba(20,20,30,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.8rem;
    color: #fff;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    max-width: 240px;
    z-index: 200;
    backdrop-filter: blur(10px);
  }

  #tooltip.visible { opacity: 1; }

  #tooltip strong {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 4px;
    color: #fff;
  }

  #tooltip span {
    color: rgba(255,255,255,0.6);
    font-size: 0.75rem;
  }

  #controls {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 100;
  }

  .ctrl-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .ctrl-btn:hover { background: rgba(255,255,255,0.15); }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 32px;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.3);
  }

    width: 360px;
    height: 100vh;
    background: rgba(12,12,20,0.97);
    border-left: 1px solid rgba(255,255,255,0.1);

// ── PANEL LOGIC ──────────────────────────────────────────────────────────────

const CATEGORY_META = {
  center: { label: 'All Fields', color: '#e85d9c' },
  stem: { label: 'STEM', color: '#4fa3f7' },
  stemSub: { label: 'STEM · Subfield', color: '#7fc8fb' },
  social: { label: 'Social Sciences', color: '#f4a24a' },
  socialSub: { label: 'Social Sciences · Subfield', color: '#f9c47e' },
  humanities: { label: 'Humanities', color: '#a78bfa' },
  humanitiesSub: { label: 'Humanities · Subfield', color: '#c4b5fd' },
};

function openPanel(node) {
  const panel = document.getElementById('detail-panel');
  const tag = document.getElementById('panel-category-tag');
  const title = document.getElementById('panel-title');
  const subtitle = document.getElementById('panel-subtitle');
  const projectsEl = document.getElementById('panel-projects');
  const emptyEl = document.getElementById('panel-empty');

  const meta = CATEGORY_META[node.type] || { label: 'Research', color: '#888' };
  const projects = PROJECT_DATA[node.id] || [];

  tag.textContent = meta.label;
  tag.style.background = meta.color + '22';
  tag.style.color = meta.color;
  tag.style.border = '1px solid ' + meta.color + '44';

  title.textContent = node.label.replace('\n', ' ');
  title.style.color = meta.color;
  subtitle.textContent = projects.length
    ? `${projects.length} research project${projects.length !== 1 ? 's' : ''}`
    : nodeInfo[node.id]?.desc || '';

  projectsEl.innerHTML = '';

  if (projects.length === 0) {
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    projects.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <div class="project-number">Project ${String(i + 1).padStart(2, '0')}</div>
        <div class="project-title">${p.title}</div>
        <div class="project-pi">${p.pi}</div>
      `;
      // Accent the left border with node color
      card.style.borderLeft = `3px solid ${meta.color}55`;
      projectsEl.appendChild(card);
    });
  }

  panel.classList.add('open');
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
}

// Close panel on Escape
window.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });



function radius(n, type) {
  if (type === 'center') return 78;
  const base = type.includes('Sub') ? 28 : 52;
  return base + Math.sqrt(n) * 8;
}

// ── SVG RENDER ───────────────────────────────────────────────────────────────

const svg = document.getElementById('svg');
const W = window.innerWidth, H = window.innerHeight;
const CX = W / 2, CY = H / 2;

let viewX = CX, viewY = CY, scale = 0.82;

function worldToScreen(x, y) {
  return [viewX + x * scale, viewY + y * scale];
}

let isDragging = false, lastMX = 0, lastMY = 0;

document.getElementById('canvas-wrap').addEventListener('mousedown', e => {
  isDragging = true;
  lastMX = e.clientX;
  lastMY = e.clientY;
});

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  viewX += e.clientX - lastMX;
  viewY += e.clientY - lastMY;
  lastMX = e.clientX;
  lastMY = e.clientY;
  render();
});

window.addEventListener('mouseup', () => isDragging = false);

document.getElementById('canvas-wrap').addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  scale *= factor;
  scale = Math.min(3, Math.max(0.2, scale));
  render();
}, { passive: false });

function zoom(f) {
  scale *= f;
  scale = Math.min(3, Math.max(0.2, scale));
  render();
}

function resetView() {
  viewX = CX; viewY = CY; scale = 0.82;
  render();
}

const tooltip = document.getElementById('tooltip');

function showTip(node, sx, sy) {
  const info = nodeInfo[node.id] || {};
  const hasProjects = PROJECT_DATA[node.id] && PROJECT_DATA[node.id].length > 0;
  tooltip.innerHTML = `<strong>${node.label.replace('\n', ' ')}</strong>
    <span>${info.desc || ''}</span>
    <br><span style="color:#fff;margin-top:6px;display:block">${info.projects} project${info.projects !== 1 ? 's' : ''}</span>
    ${hasProjects ? '<span style="color:rgba(255,255,255,0.35);font-size:0.7rem;margin-top:4px;display:block">↗ Click to see all projects & PIs</span>' : ''}`;
  let tx = sx + 16, ty = sy - 40;
  if (tx + 250 > W) tx = sx - 260;
  if (ty < 10) ty = sy + 16;
  tooltip.style.left = tx + 'px';
  tooltip.style.top = ty + 'px';
  tooltip.classList.add('visible');
}

function hideTip() { tooltip.classList.remove('visible'); }

function render() {
  svg.innerHTML = '';

  // Definitions
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');

  // Glow filters
  const glows = [
    { id: 'glow-center', color: '#e85d9c' },
    { id: 'glow-stem', color: '#4fa3f7' },
    { id: 'glow-social', color: '#f4a24a' },
    { id: 'glow-human', color: '#a78bfa' },
  ];
  glows.forEach(g => {
    const f = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    f.setAttribute('id', g.id);
    f.setAttribute('x', '-50%'); f.setAttribute('y', '-50%');
    f.setAttribute('width', '200%'); f.setAttribute('height', '200%');
    const fe = document.createElementNS('http://www.w3.org/2000/svg', 'feDropShadow');
    fe.setAttribute('dx', '0'); fe.setAttribute('dy', '0');
    fe.setAttribute('stdDeviation', '12');
    fe.setAttribute('flood-color', g.color);
    fe.setAttribute('flood-opacity', '0.6');
    f.appendChild(fe);
    defs.appendChild(f);
  });

  svg.appendChild(defs);

  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  // Draw edges
  edges.forEach(([a, b]) => {
    const na = nodeMap[a], nb = nodeMap[b];
    const [x1, y1] = worldToScreen(na.x, na.y);
    const [x2, y2] = worldToScreen(nb.x, nb.y);

    const col = nb.type.includes('stem') ? COLORS.stem :
                nb.type.includes('social') || nb.type.includes('Social') ? COLORS.social :
                nb.type.includes('human') ? COLORS.humanities : COLORS.center;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', col);
    line.setAttribute('stroke-width', a === 'center' ? 3 : 1.5);
    line.setAttribute('class', 'edge-line');
    svg.appendChild(line);
  });

  // Draw nodes
  nodes.forEach(n => {
    const [sx, sy] = worldToScreen(n.x, n.y);
    const r = radius(n.count, n.type) * (n.type === 'center' ? scale : scale);

    const color = COLORS[n.type] || '#888';
    const glowFilter = n.type === 'center' ? 'url(#glow-center)' :
                       n.type.includes('stem') ? 'url(#glow-stem)' :
                       n.type.includes('social') || n.type.includes('Social') ? 'url(#glow-social)' :
                       'url(#glow-human)';

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node-circle');
    g.style.filter = glowFilter;

    // Shadow circle (darker)
    const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    shadow.setAttribute('cx', sx + 2); shadow.setAttribute('cy', sy + 3);
    shadow.setAttribute('r', r);
    shadow.setAttribute('fill', 'rgba(0,0,0,0.4)');
    g.appendChild(shadow);

    // Main circle
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', sx); circle.setAttribute('cy', sy);
    circle.setAttribute('r', r);

    // Gradient fill
    const gradId = 'grad-' + n.id;
    const grad = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
    grad.setAttribute('id', gradId);
    grad.setAttribute('cx', '35%'); grad.setAttribute('cy', '35%');
    grad.setAttribute('r', '60%');
    const s1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    s1.setAttribute('offset', '0%');
    s1.setAttribute('stop-color', lighten(color, 0.4));
    const s2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    s2.setAttribute('offset', '100%');
    s2.setAttribute('stop-color', darken(color, 0.25));
    grad.appendChild(s1); grad.appendChild(s2);
    defs.appendChild(grad);
    circle.setAttribute('fill', `url(#${gradId})`);
    circle.setAttribute('stroke', lighten(color, 0.3));
    circle.setAttribute('stroke-width', n.type === 'center' ? 3 : 1.5);
    g.appendChild(circle);

    // Count badge for main categories
    if ((n.type === 'stem' || n.type === 'social' || n.type === 'humanities') && r > 20) {
      const badge = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      badge.setAttribute('cx', sx + r * 0.6);
      badge.setAttribute('cy', sy - r * 0.6);
      badge.setAttribute('r', r * 0.28);
      badge.setAttribute('fill', '#0e0e14');
      badge.setAttribute('stroke', color);
      badge.setAttribute('stroke-width', '1.5');
      g.appendChild(badge);

      const badgeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      badgeText.setAttribute('x', sx + r * 0.6);
      badgeText.setAttribute('y', sy - r * 0.6);
      badgeText.setAttribute('text-anchor', 'middle');
      badgeText.setAttribute('dominant-baseline', 'central');
      badgeText.setAttribute('fill', '#fff');
      badgeText.setAttribute('font-size', Math.max(9, r * 0.22) + 'px');
      badgeText.setAttribute('font-family', 'DM Sans, sans-serif');
      badgeText.setAttribute('font-weight', '700');
      badgeText.textContent = n.count;
      badgeText.style.pointerEvents = 'none';
      g.appendChild(badgeText);
    }

    // Label
    const lines = n.label.split('\n');
    const fontSize = n.type === 'center' ? Math.max(10, r * 0.18) :
                     n.type.includes('Sub') ? Math.max(8, r * 0.3) :
                     Math.max(9, r * 0.22);

    if (lines.length === 1) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', sx); t.setAttribute('y', sy);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'central');
      t.setAttribute('fill', '#fff');
      t.setAttribute('font-size', fontSize + 'px');
      t.setAttribute('font-family', 'DM Sans, sans-serif');
      t.setAttribute('font-weight', '700');
      t.setAttribute('letter-spacing', '0.05em');
      t.style.pointerEvents = 'none';
      t.textContent = lines[0];
      g.appendChild(t);
    } else {
      const lineH = fontSize * 1.3;
      lines.forEach((line, i) => {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        const offsetY = (i - (lines.length - 1) / 2) * lineH;
        t.setAttribute('x', sx); t.setAttribute('y', sy + offsetY);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.setAttribute('fill', '#fff');
        t.setAttribute('font-size', fontSize + 'px');
        t.setAttribute('font-family', 'DM Sans, sans-serif');
        t.setAttribute('font-weight', '700');
        t.setAttribute('letter-spacing', '0.05em');
        t.style.pointerEvents = 'none';
        t.textContent = line;
        g.appendChild(t);
      });
    }

    g.addEventListener('mouseenter', e => showTip(n, sx, sy));
    g.addEventListener('mouseleave', hideTip);
    g.addEventListener('click', e => {
      e.stopPropagation();
      hideTip();
      openPanel(n);
    });

    svg.appendChild(g);
  });
}

function lighten(hex, amt) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const toHex = v => Math.min(255, Math.round(v)).toString(16).padStart(2,'0');
  return '#' + toHex(r + (255-r)*amt) + toHex(g + (255-g)*amt) + toHex(b + (255-b)*amt);
}

function darken(hex, amt) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const toHex = v => Math.max(0, Math.round(v)).toString(16).padStart(2,'0');
  return '#' + toHex(r*(1-amt)) + toHex(g*(1-amt)) + toHex(b*(1-amt));
}

render();
window.addEventListener('resize', () => { resetView(); });
